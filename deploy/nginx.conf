server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings: the gallery page is the only entry point.
    autoindex off;

    # Markdown and plain-text records open in the browser instead of downloading.
    location ~* \.(md|txt)$ {
        default_type "text/plain; charset=utf-8";
        add_header Content-Disposition "inline";
    }

    # Large video files: let nginx handle byte ranges for seeking.
    location /videos/ {
        types {
            video/mp4 mp4;
        }
        add_header Accept-Ranges bytes;
    }
}
