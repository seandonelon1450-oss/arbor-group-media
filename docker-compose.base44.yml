# Base44 dev environment for arbor-group-media.
#
# This repository is a media asset + legal record library: there is no application
# to build. Nginx serves the checked-out assets directly from the sandbox checkout
# (bind-mounted read-only, no image build), so any file change is visible on reload.
#
# .git is deliberately NOT mounted: only the asset folders and the manifest are exposed.
services:
  site:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./videos:/usr/share/nginx/html/videos:ro
      - ./logos:/usr/share/nginx/html/logos:ro
      - ./bots:/usr/share/nginx/html/bots:ro
      - ./legal:/usr/share/nginx/html/legal:ro
      - ./TIMESTAMP-MANIFEST-2026-10-19.md:/usr/share/nginx/html/TIMESTAMP-MANIFEST-2026-10-19.md:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    labels:
      base44.project: "Arbor Group Media"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
